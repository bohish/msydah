name: HayTrip iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project HayTrip.xcodeproj \
            -target HayTrip \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
